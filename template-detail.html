<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>樣板詳情</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/gallery.css">
</head>
<body>
<div class="container" style="padding:40px 24px">
 <a href="index.html">← 返回</a>
 <div id="detail"></div>
</div>
<script src="assets/js/data.js"></script>
<script>
function getTemplateTags(t){if(Array.isArray(t.tags))return t.tags;if(t.tags&&typeof t.tags==='object')return Object.values(t.tags).flat().filter(Boolean);return [];}
const params=new URLSearchParams(location.search);
const id=params.get('id');
const t=(typeof TEMPLATES_DATA!=='undefined'?TEMPLATES_DATA:[]).find(x=>x.id===id);
const el=document.getElementById('detail');
if(!t){el.innerHTML='<p>找不到樣板</p>';}
else{
 const pages=["index.html","about.html","services.html","service-detail.html","portfolio.html","reviews.html","faq.html","booking.html","process.html","blog.html","blog-detail.html","contact.html"];
 el.innerHTML=`<h1>${t.name}</h1>
 <img src="${t.previewImage}" style="max-width:700px;border-radius:12px;margin:20px 0" onerror="this.src='https://picsum.photos/seed/${t.id}/700/450'">
 <p>${t.description}</p>
 <ul>
  <li>產業：${t.industry} / ${t.industryCategory}</li>
  <li>色系：${t.colorTheme}</li>
  <li>背景：${t.backgroundMode}</li>
  <li>版型：${t.layoutType}</li>
  <li>頁數：${t.pageCount}</li>
 </ul>
 <p>Tags：${getTemplateTags(t).join('、')}</p>
 <div style="display:flex;gap:8px;margin-top:16px">
  <a href="${t.demoUrl}" target="_blank"><button style="background:#22c55e;border:0;color:#fff;padding:10px 16px;border-radius:8px">預覽網站</button></a>
  <a href="${t.promptUrl}" target="_blank"><button style="border:0;color:#fff;padding:10px 16px;border-radius:8px;background:#374151">查看 Prompt</button></a>
  <button disabled style="padding:10px 16px;border-radius:8px">ZIP 待打包</button>
 </div>
 <h3 style="margin-top:24px">12 頁頁面清單</h3>
 <ul>${pages.map(p=>`<li>${p}</li>`).join('')}</ul>
 <p>圖片來源注意事項：圖片僅作為設計示意，正式交付前請替換。</p>`;
}
</script>
</body>
</html>
