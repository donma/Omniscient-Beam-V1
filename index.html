<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全職設計視角｜樣板展示</title>
<meta name="description" content="全職設計視角：24 套完整網站樣板展示平台。">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/gallery.css">
</head>
<body>
<header class="header">
 <div class="container nav">
  <a href="index.html" class="logo">全職設計視角</a>
  <ul class="navlinks">
   <li><a href="index.html">首頁</a></li>
   <li><a href="index.html">瀏覽樣板</a></li>
   <li><a href="index.html">產業分類</a></li>
   <li><a href="index.html">功能分類</a></li>
   <li><a href="index.html">配色分類</a></li>
   <li><a href="index.html">使用說明</a></li>
   <li><a href="index.html">關於我們</a></li>
  </ul>
 </div>
</header>
<section class="hero">
 <div class="container">
  <h1>全職設計視角</h1>
  <p>24 套完整網站樣板，涵蓋多產業與多版型，可直接預覽與修改。</p>
  <p style="color:#9aa4b2">總頁面數：288 頁 · 深色底 12 套 · 淺色底 12 套</p>
 </div>
</section>
<section class="container">
 <div class="filters">
  <aside class="sidebar">
   <input id="search" class="search" placeholder="搜尋樣板 / tags">
   <div class="filter-group">
    <h4>產業分類</h4>
    <select id="filterIndustry" class="search">
     <option>全部</option>
     <option>餐飲甜點</option><option>美容健康</option><option>美妝美業</option><option>零售商品</option>
     <option>專業服務</option><option>教育課程</option><option>創意設計</option><option>空間生活</option>
     <option>旅遊休閒</option><option>科技商務</option><option>地方品牌</option><option>個人品牌</option>
     <option>活動組織</option><option>寵物服務</option>
    </select>
   </div>
   <div class="filter-group">
    <h4>背景模式</h4>
    <select id="filterBg" class="search">
     <option>全部</option><option>深色底</option><option>淺色底</option>
    </select>
   </div>
   <div class="filter-group">
    <h4>版型類型</h4>
    <select id="filterLayout" class="search">
     <option>全部</option>
     <option>大圖沉浸式 Hero</option><option>左右分割 Split Layout</option><option>Magazine 雜誌式首頁</option>
     <option>Masonry 作品牆</option><option>商品型 Grid Catalog</option><option>Storytelling 長卷軸</option>
     <option>Bento Grid 現代資訊版</option><option>Editorial 文字導向</option><option>Dashboard Data 信任型</option>
     <option>Event Campaign 活動型</option><option>Left Rail 左側導覽型</option>
     <option>Pricing-first 方案導向型</option><option>Knowledge Hub 知識中心型</option>
    </select>
   </div>
   <p style="color:#9aa4b2">顯示：<span id="statCount">0</span> 套</p>
  </aside>
  <div>
   <div class="toggle">
    <button onclick="setView('grid')" class="active">Grid</button>
    <button onclick="setView('list')">List</button>
   </div>
   <div id="templatesGrid" class="templates-grid"></div>
  </div>
 </div>
</section>
<script src="assets/js/data.js"></script>
<script src="assets/js/gallery.js"></script>
</body>
</html>
